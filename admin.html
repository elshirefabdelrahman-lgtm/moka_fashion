<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOKA Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><div class="brand">MOKA</div><nav id="adminNav"><button class="nav-btn active" data-section="overview">Dashboard</button><button class="nav-btn" data-section="orders">Orders</button><button class="nav-btn" data-section="customers">Customers</button><button class="nav-btn" data-section="products">Products</button><button class="nav-btn" data-section="collections">Collections</button><button class="nav-btn" data-section="sales">Sales</button><button class="nav-btn" data-section="settings">Settings</button></nav></aside><main class="main"><header class="topbar"><div><h1 id="pageTitle">Dashboard</h1><span class="muted" id="adminEmail"></span></div><button class="btn secondary" id="refreshButton">Refresh</button></header><div id="notice"></div><section class="section active" id="overview"><div class="grid" id="metrics"></div><div class="panel" style="margin-top:16px"><h2>Recent Orders</h2><div class="table-wrap" id="recentOrders"></div></div></section><section class="section" id="orders"><div class="toolbar"><input class="input" id="orderSearch" placeholder="Search order, customer, phone"><select id="orderStatus"><option value="">All statuses</option><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>completed</option><option>cancelled</option></select></div><div class="panel table-wrap" id="ordersTable"></div></section><section class="section" id="customers"><div class="toolbar"><input class="input" id="customerSearch" placeholder="Search name or phone"></div><div class="panel table-wrap" id="customersTable"></div></section><section class="section" id="products"><div class="toolbar"><button class="btn" data-action="new-product">Add Product</button></div><div class="panel table-wrap" id="productsTable"></div></section><section class="section" id="collections"><div class="toolbar"><button class="btn" data-action="new-collection">Add Collection</button></div><div class="panel table-wrap" id="collectionsTable"></div></section><section class="section" id="sales"><div class="grid" id="salesMetrics"></div><div class="panel" style="margin-top:16px" id="salesProducts"></div></section><section class="section" id="settings"><div class="panel"><h2>Session</h2><p id="settingsEmail"></p><button class="btn danger" id="logoutButton">Sign Out</button></div></section></main></div><div class="modal" id="adminModal"><div class="modal-box"><button class="btn secondary" style="float:right" data-action="close-modal">Close</button><div id="modalContent"></div></div></div><script type="module" src="admin.js"></script></body></html>
